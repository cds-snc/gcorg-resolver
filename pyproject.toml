 [build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gcorg-resolver"
version = "0.2.0"
description = "HTTP API that resolves Government of Canada organization names"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "flask>=3.0",
    "unidecode>=1.3",
]

[project.optional-dependencies]
lambda = [
    "mangum>=0.19",
    "asgiref>=3.8",
]
metrics = [
    "boto3>=1.34",
    "matplotlib>=3.9",
    "pandas>=2.0",
    "plotly>=5.0",
    "pillow>=12.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gcorg_resolver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
"data/update_aliases.py" = ["E402"]
"data/renormalize_aliases.py" = ["E402"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.10",
]

name: Terraform plan (prod)

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
      - "src/**"
      - "data/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/terraform-plan-prod.yml"
      - ".github/workflows/terraform-apply-prod.yml"

concurrency:
  group: terraform-prod-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ca-central-1
  TF_INPUT: "false"
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build Lambda zip
        run: bash infra/build_lambda.sh

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.SDR_AWS_ACCOUNT }}:role/gcorg-resolver-plan-prod
          role-session-name: TFPlanProd
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: cds-snc/terraform-tools-setup@36df0d7572a15921998170395475093c183d720a # v1.3.0
        env:
          TERRAFORM_VERSION: 1.14.8

      - name: Terraform plan
        uses: cds-snc/terraform-plan@e08baaf605af7604ca7a138b6115be6dbd2882e8 # v5.0.5
        with:
          directory: infra/env/prod
          github-token: ${{ secrets.GITHUB_TOKEN}}
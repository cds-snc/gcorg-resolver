name: Integration tests

permissions:
  contents: read

on:
  workflow_run:
    workflows: ["Terraform apply (prod)"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "5 12 * * *"  # Daily just after noon; off the hour to avoid GitHub's top-of-hour scheduling delays
      timezone: "America/Toronto"

jobs:
  integration-test:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && format('refs/heads/{0}', github.event.workflow_run.head_branch) || github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Run integration tests
        env:
          BASE_URL: ${{ vars.API_BASE_URL_PROD }}
        run: uv run --frozen python tests/integration_api.py

      - name: Slack message if integration testing fails
        if: ${{ failure() }}
        run: |
          json='{"blocks":[{"type":"section","text":{"type":"mrkdwn","text":":rotating_light: Integration tests failed in the <https://github.com/cds-snc/gcorg-resolver|GC Organization Name Resolution API>. Please investigate or reach out to <@U07QX02BQS2> for help."}}]}'
          curl -X POST -H 'Content-type: application/json' --data "$json" ${{ secrets.SRE_BOT_WEBHOOK_ALERT }}